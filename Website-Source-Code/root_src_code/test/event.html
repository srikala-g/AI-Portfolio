<script type="text/javascript">
$(document).ready(function() {
$curtainopen = false;
$(".rope").click(function(){
$(this).blur();
if ($curtainopen == false){ 
$(this).stop().animate({top: '-400px' }, {queue:false, duration:350, easing:'easeOutBounce'}); 
$(".leftcurtain").stop().animate({width:'60px'}, 3000 );
$(".rightcurtain").stop().animate({width:'60px'},3000 );
$curtainopen = true;
}else{
$(this).stop().animate({top: '-400px' }, {queue:false, duration:350, easing:'easeOutBounce'}); 
$(".leftcurtain").stop().animate({width:'50%'}, 3000 );
$(".rightcurtain").stop().animate({width:'51%'}, 3000 );
$curtainopen = false;
}
return false;
});
});	
</script>
